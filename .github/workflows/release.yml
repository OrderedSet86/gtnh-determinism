name: Release jars

# Manual trigger only: Actions tab -> "Release jars" -> Run workflow, enter the version
# (e.g. 0.4). Builds the community fix jar (fix-build -> gtnhdeterminism), the client
# quality-of-life jar (qol-build -> gtnhspeedrunqol) and the test harness jar
# (probe-build -> worldgenprobe), tags v<version>, and attaches all three to a GitHub
# release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.4)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Tag before building so GTNHGradle's git-describe version stamps the jars with it
      - name: Tag
        run: |
          git config user.name "OrderedSet86"
          git config user.email "orderedset86@users.noreply.github.com"
          git tag "v${{ inputs.version }}"

      # Both resource copies are gitignored. Without them, the fix jar does not refill the chests of the Witchery
      # buildings in the table, and the prefilter in the probe jar skips those chests
      - name: Copy the shared chest table
        run: |
          for d in fix-build probe-build; do
            cp shared/chest-nohooks.json "$d/src/main/resources/chest-nohooks.json"
          done

      - name: Build fix jar (gtnhdeterminism)
        working-directory: fix-build
        run: ./gradlew build -x test -x spotlessCheck

      - name: Build QoL jar (gtnhspeedrunqol)
        working-directory: qol-build
        run: ./gradlew build -x test -x spotlessCheck

      - name: Build probe jar (worldgenprobe)
        working-directory: probe-build
        run: ./gradlew build -x test -x spotlessCheck

      - name: Collect artifacts
        run: |
          # A JvmDowngrader build also writes -downgraded.jar and -predowngrade.jar. Those jars have the dev (MCP)
          # names and no shaded stubs, and the game stops at startup on them. -downgraded.jar sorts before the
          # release jar, so select by name
          releaseJar() {
            local jars
            jars=$(ls "$1"/build/libs/*.jar | grep -v -E -- '-(dev|sources|downgraded|predowngrade)\.jar$' || true)
            if [ "$(printf '%s' "$jars" | grep -c .)" -ne 1 ]; then
              echo "::error::expected one release jar in $1/build/libs, found: ${jars:-none}"
              return 1
            fi
            echo "$jars"
          }
          fix_jar=$(releaseJar fix-build)
          qol_jar=$(releaseJar qol-build)
          probe_jar=$(releaseJar probe-build)
          mkdir -p dist
          cp "$fix_jar" "dist/gtnhdeterminism-${{ inputs.version }}.jar"
          cp "$qol_jar" "dist/gtnhspeedrunqol-${{ inputs.version }}.jar"
          cp "$probe_jar" "dist/worldgenprobe-${{ inputs.version }}.jar"
          ls -la dist/

      - name: Check jar contents
        run: |
          for jar in dist/gtnhdeterminism-${{ inputs.version }}.jar dist/worldgenprobe-${{ inputs.version }}.jar; do
            if ! unzip -p "$jar" chest-nohooks.json | cmp -s - shared/chest-nohooks.json; then
              echo "::error::$jar has no chest-nohooks.json, or a copy that differs from shared/chest-nohooks.json"
              exit 1
            fi
          done

          # every stub that a class calls must be in the jar, under the jar's package prefix
          checkStubs() {
            local jar=$1 prefix=$2 unrelocated
            if ! unzip -Z1 "$jar" | grep -q "^$prefix/xyz/wagyourtail/jvmdg/"; then
              echo "::error::$jar has no JvmDowngrader stubs under $prefix/"
              return 1
            fi
            unrelocated=$(unzip -p "$jar" | grep -a -o -P '(?<!/)xyz/wagyourtail/jvmdg/j[0-9]+/stub/' | wc -l)
            if [ "$unrelocated" -ne 0 ]; then
              echo "::error::$jar has $unrelocated calls to JvmDowngrader stubs that are not under $prefix/"
              return 1
            fi
          }
          checkStubs dist/gtnhdeterminism-${{ inputs.version }}.jar gtnhdeterminism
          checkStubs dist/worldgenprobe-${{ inputs.version }}.jar worldgenprobe

      # The route-map generator ships as a zip rather than a jar: it is the Python tool a player
      # runs to build a map of their own seed. The viewer and the bundle builder live in the
      # gtnh-seedlib repo, so that has to be on disk too.
      - name: Check out gtnh-seedlib (route map viewer + bundle builder)
        uses: actions/checkout@v4
        with:
          repository: OrderedSet86/gtnh-seedlib
          path: .seedlib
          # Only routemap/, tools/ and browser/lootscore.py are needed and none is LFS-tracked;
          # lfs: true would drag down ~264 MB of seed-corpus tarballs this does not touch.
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the route map zips
        run: |
          # --jars dist is load-bearing: without it the build fetches the LATEST PUBLISHED release,
          # which during a release is the PREVIOUS version, and the zip would ship stale jars.
          python3 scripts/build-routemap-zip.py --platform all --out dist \
            --seedlib .seedlib --jars dist
          ls -la dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" dist/*.jar dist/*.zip \
            --title "gtnhdeterminism ${{ inputs.version }}" \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            --notes "Community testing jar gtnhdeterminism-${{ inputs.version }}.jar makes world generation a pure function of the seed (install in mods/). gtnhspeedrunqol-${{ inputs.version }}.jar is an independent client-side quality-of-life jar; install it alone or alongside, it changes nothing the game simulates. worldgenprobe-${{ inputs.version }}.jar is the headless worldgen test harness, not needed for normal play. GTNH-Routemap-windows.zip / -unix.zip generate an interactive map of your own seed: unzip and run it. No Java install needed; Windows needs nothing else, macOS and Linux need python3 with numpy and pillow (pip install numpy pillow)."
