dependencies {
    // Mixin target for the opt-in parallel-noise fast path (-Dprobe.parallelnoise=true)
    compileOnly('com.github.GTNewHorizons:Realistic-World-Gen:alpha-1.5.2:dev')
    // The stage-0 prefilter's Roguelike module constructs the real WorldEditor and Dungeon instead of
