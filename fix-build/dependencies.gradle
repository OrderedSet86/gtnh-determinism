// Add your dependencies here

dependencies {
    compileOnly('thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev')
    compileOnly('com.github.GTNewHorizons:TinkersConstruct:1.14.96-GTNH:dev')
    // MUST track the line the pack actually ships (2.8.4 = 5.09.51.482, the 5.09.50.119-era ore API).
    // 5.09.54.x replaced that API wholesale — IOreMaterial instead of the mPrimaryMeta shorts,
    // veinHeight instead of mMinY/mMaxY, and no TileEntityOres.setOreBlock at all — so an ore mixin
    // written against 54.x compiles but cannot bind against what runs.
    // transitive=false: 5.09.51.482 pulls CodeChickenLib 1.3.0, purged from the GTNH maven. Nothing we
    // touch in GT exposes a CCL type, so the stubs are unnecessary.
    compileOnly('com.github.GTNewHorizons:GT5-Unofficial:5.09.51.482:dev') { transitive = false }
    compileOnly(rfg.deobf('curse.maven:biomes-o-plenty-220318:2499612'))
    compileOnly(rfg.deobf('curse.maven:witchery-69673:2234410'))
    compileOnly('com.github.GTNewHorizons:Realistic-World-Gen:alpha-1.5.2:dev')
    compileOnly('com.github.GTNewHorizons:ProjectRed:4.12.39-GTNH:dev')
    compileOnly('com.github.GTNewHorizons:MrTJPCore:1.3.7:dev')
    compileOnly('com.github.GTNewHorizons:ForestryMC:4.11.31:dev')
    // 1.6.0-GTNH (shipped in 2.7.4) is purged from the maven; 1.6.2 has identical Dungeon/WorldEditor (verified)
    compileOnly('com.github.GTNewHorizons:Roguelike-Dungeons:1.6.2-GTNH:dev')
    // transitive=false: LootGames pulls Yamcl 0.6.0, purged from the GTNH maven
    compileOnly('com.github.GTNewHorizons:LootGames:2.1.4:dev') { transitive = false }
    // Deepslate layer band RNG (EtFuturumDeepslateMixin). Mixin's AP resolves targets= at compile time,
    // so the class must be on the classpath even though the mixin references it only by name.
    compileOnly('ganymedes01.etfuturum:Et-Futurum-Requiem:2.6.2.25-GTNH:dev') { transitive = false }
}
